# goreleaser build/release config. Validate with `goreleaser check`.
# Release: push a tag (e.g. v0.1.0); the release workflow runs `goreleaser release`.
version: 2

project_name: chrome-cdp

before:
  hooks:
    - go mod tidy

builds:
  - id: chrome-cdp
    main: ./cmd/chrome-cdp
    binary: chrome-cdp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/sanketsudake/chrome-cdp-cli/internal/cli.Version={{ .Version }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - config.example.toml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Build/CI
      regexp: '^(build|ci)(\(.+\))?:'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Homebrew tap (macOS cask for the prebuilt binary). Requires a
# `sanketsudake/homebrew-tap` repo and a HOMEBREW_TAP_GITHUB_TOKEN secret (a
# fine-grained PAT scoped to that tap repo with Contents: read/write) so
# goreleaser can push the generated cask there during a release. Linux users
# install via the tarball or `go install`.
homebrew_casks:
  - name: chrome-cdp
    repository:
      owner: sanketsudake
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/sanketsudake/chrome-cdp-cli"
    description: "Drive your already-running local Chrome from the command line over CDP"
    # Strip the quarantine xattr so the unsigned binary runs without a Gatekeeper prompt.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/chrome-cdp"]
          end
