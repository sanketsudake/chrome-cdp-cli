name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Skipped on windows: the runner's git checks files out CRLF (no
      # .gitattributes forcing LF here) and gofmt -l would flag the entire
      # tree on line endings alone, not real formatting — a false red. The
      # same bytes are already checked on ubuntu/macos, so this adds no
      # coverage windows-side.
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # ubuntu-latest ships google-chrome-stable, so the live-Chrome integration
      # test runs there; on macOS (no Chrome) it skips itself gracefully.
      - name: Test
        if: runner.os != 'Windows'
        run: go test -race ./...

      # windows-latest has no cgo toolchain wired for -race, and no Chrome to
      # run the live suite against, so it gets the short suite only.
      - name: Test (short)
        if: runner.os == 'Windows'
        shell: bash
        run: go test -short ./...

      - name: Build
        run: go build ./...
